<!DOCTYPE html>
<html lang="id">

<head>

    <!-- =====================================================
         01. HTML — HEAD / PENGATURAN DASAR
         Fungsi:
         - Mengatur bahasa
         - Responsive HP
         - Nama halaman
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ASCEND × AVENOX</title>


    <!-- =====================================================
         02. CSS
         Semua desain loading screen ada di bawah ini.
    ====================================================== -->

    <style>


        /* =====================================================
           CSS 01 — RESET
           Fungsi:
           Menghapus margin/padding bawaan browser.
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           CSS 02 — BODY
           Fungsi:
           Mengatur layar utama website.
        ====================================================== */

        body {
            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #050505;

            color: #ffffff;

            font-family: Arial, sans-serif;
        }


        /* =====================================================
           CSS 03 — LOADING SCREEN
           Fungsi:
           Container utama seluruh loading screen.
        ====================================================== */

        .loading-screen {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.08),
                    transparent 40%
                ),
                #050505;

            overflow: hidden;

            z-index: 9999;
        }


        /* =====================================================
           CSS 04 — BACKGROUND GLOW
           Fungsi:
           Membuat cahaya lembut di belakang logo.
        ====================================================== */

        .background-glow {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(255,255,255,0.05);

            filter: blur(100px);

            animation: glowMove 3s ease-in-out infinite alternate;
        }


        @keyframes glowMove {

            from {
                transform: scale(0.8);
                opacity: 0.3;
            }

            to {
                transform: scale(1.2);
                opacity: 0.8;
            }

        }


        /* =====================================================
           CSS 05 — BACKGROUND TEXT
           Fungsi:
           Tulisan besar ASCEND dan AVENOX
           yang berada di belakang konten utama.
        ====================================================== */

        .background-text {
            position: absolute;

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 10px;

            pointer-events: none;

            user-select: none;
        }


        .background-text span {

            font-size: clamp(60px, 13vw, 180px);

            font-weight: 900;

            letter-spacing: 8px;

            line-height: 0.8;

            text-align: center;

            color: transparent;

            -webkit-text-stroke:
                1px rgba(255,255,255,0.12);

            white-space: nowrap;

            animation:
                backgroundTextMove
                5s
                ease-in-out
                infinite
                alternate;
        }


        .background-text span:nth-child(2) {

            animation-delay: -2s;

        }


        @keyframes backgroundTextMove {

            from {
                transform: translateX(-20px);
            }

            to {
                transform: translateX(20px);
            }

        }


        /* =====================================================
           CSS 06 — CENTER CONTENT
           Fungsi:
           Mengatur semua konten yang berada di tengah.
        ====================================================== */

        .center-content {

            position: relative;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        /* =====================================================
   CSS 07 — BIG COUNTDOWN
   Fungsi:
   Angka countdown besar di tengah loading screen.
===================================================== */

.logo {

    width: 150px;
    height: 150px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,0.25);

    border-radius: 50%;

    font-size: 80px;

    font-weight: 900;

    line-height: 1;

    color: #ffffff;

    text-shadow:
        0 0 20px rgba(255,255,255,0.35),
        0 0 50px rgba(255,255,255,0.15);

    box-shadow:
        0 0 30px rgba(255,255,255,0.08),
        inset 0 0 30px rgba(255,255,255,0.04);

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}


/* =====================================================
   CSS 07.01 — COUNTDOWN CHANGE
   Fungsi:
   Efek ketika angka berubah.
===================================================== */

.logo.countdown-change {

    transform: scale(1.15);

    opacity: 0.5;

    
}================================================
           CSS 08 — EVENT TITLE
           Fungsi:
           Mengatur tulisan ASCEND × AVENOX.
        ====================================================== */

        .event-title {

            margin-top: 28px;

            font-size: clamp(28px, 6vw, 70px);

            font-weight: 900;

            letter-spacing: 8px;

            text-transform: uppercase;
        }


        .event-title span {

            opacity: 0.45;

        }


        /* =====================================================
           CSS 09 — SUBTITLE
           Fungsi:
           Tulisan kecil di bawah nama event.
        ====================================================== */

        .subtitle {

            margin-top: 8px;

            font-size: 12px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: rgba(255,255,255,0.5);
        }


        /* =====================================================
           CSS 10 — LOADING CONTAINER
           Fungsi:
           Mengatur posisi dan ukuran loading bar.
        ====================================================== */

        .loading-container {

            width: 230px;

            margin-top: 40px;
        }


        /* =====================================================
           CSS 11 — LOADING INFO
           Fungsi:
           Menampilkan INITIALIZING dan angka persen.
        ====================================================== */

        .loading-info {

            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;

            font-size: 10px;

            letter-spacing: 2px;

            color: rgba(255,255,255,0.5);
        }


        /* =====================================================
           CSS 12 — LOADING BAR BACKGROUND
           Fungsi:
           Background dari progress bar.
        ====================================================== */

        .loading-bar {

            width: 100%;

            height: 2px;

            background: rgba(255,255,255,0.15);

            overflow: hidden;
        }


        /* =====================================================
           CSS 13 — PROGRESS
           Fungsi:
           Bagian bar yang bergerak 0% → 100%.
        ====================================================== */

        .loading-progress {

            width: 0%;

            height: 100%;

            background: #ffffff;

            box-shadow: 0 0 15px #ffffff;

            transition: width 0.2s linear;
        }


        /* =====================================================
           CSS 14 — FOOTER
           Fungsi:
           Tulisan paling bawah loading screen.
        ====================================================== */

        .footer-text {

            position: absolute;

            bottom: 25px;

            left: 0;

            width: 100%;

            text-align: center;

            font-size: 9px;

            letter-spacing: 4px;

            color: rgba(255,255,255,0.3);
        }


        /* =====================================================
           CSS 15 — LOADING FADE OUT
           Fungsi:
           Animasi ketika loading selesai.
        ====================================================== */

        .loading-screen.hide {

            animation:
                loadingFadeOut
                0.8s
                forwards;
        }


        @keyframes loadingFadeOut {

            to {

                opacity: 0;

                visibility: hidden;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         03. HTML — LOADING SCREEN
         Semua struktur yang tampil di layar ada di sini.
    ====================================================== -->


    <!-- =====================================================
         HTML 01 — CONTAINER UTAMA
         Fungsi:
         Membungkus seluruh loading screen.
    ====================================================== -->

    <div
        class="loading-screen"
        id="loadingScreen"
    >


        <!-- =================================================
             HTML 02 — BACKGROUND GLOW
             Fungsi:
             Cahaya di belakang logo.
        ================================================== -->

        <div class="background-glow"></div>


        <!-- =================================================
             HTML 03 — BACKGROUND TEXT
             Fungsi:
             Tulisan besar di belakang.
        ================================================== -->

        <div class="background-text">

            <span>ASCEND</span>

            <span>AVENOX</span>

        </div>


        <!-- =================================================
             HTML 04 — CENTER CONTENT
             Fungsi:
             Semua konten utama di tengah.
        ================================================== -->

        <div class="center-content">


            <!-- =====================================================
     HTML 05 — BIG COUNTDOWN
     Fungsi:
     Angka besar yang mengikuti loading.
====================================================== -->

<div class="logo" id="bigCountdown">
    9
</div>

            <!-- =============================================
                 HTML 06 — EVENT TITLE
                 Fungsi:
                 Nama event.
            ============================================== -->

            <div class="event-title">

                ASCEND

                <span>×</span>

                AVENOX

            </div>


            <!-- =============================================
                 HTML 07 — SUBTITLE
                 Fungsi:
                 Deskripsi kecil event.
            ============================================== -->

            <div class="subtitle">

                Championship Experience

            </div>


            <!-- =============================================
                 HTML 08 — LOADING
            ============================================== -->

            <div class="loading-container">


                <!-- =========================================
                     HTML 09 — LOADING INFO
                ========================================== -->

                <div class="loading-info">

                    <span>
                        INITIALIZING
                    </span>

                    <span id="loadingPercent">
                        0%
                    </span>

                </div>


                <!-- =========================================
                     HTML 10 — PROGRESS BAR
                ========================================== -->

                <div class="loading-bar">

                    <div
                        class="loading-progress"
                        id="loadingProgress"
                    ></div>

                </div>

            </div>

        </div>


        <!-- =================================================
             HTML 11 — FOOTER
             Fungsi:
             Tulisan bagian bawah.
        ================================================== -->

        <div class="footer-text">

            POWERED BY ASCEND × AVENOX

        </div>


    </div>



    <script>

    /* =====================================================
       04. JAVASCRIPT — LOADING SYSTEM
    ====================================================== */

    /* =====================================================
       JS 01 — PROGRESS
       Fungsi:
       Menyimpan nilai progress dari 0 sampai 100.
    ====================================================== */

    let progress = 0;


    /* =====================================================
       JS 02 — AMBIL ELEMENT
    ====================================================== */

    const loadingScreen =
        document.getElementById("loadingScreen");

    const loadingProgress =
        document.getElementById("loadingProgress");

    const loadingPercent =
        document.getElementById("loadingPercent");


    /* =====================================================
       JS 03 — LOADING ENGINE
       Fungsi:
       Progress berjalan dari 0 → 100.
    ====================================================== */

    const loadingInterval = setInterval(() => {

        progress += 1;


        /* =================================================
           JS 04 — UPDATE PROGRESS BAR
        ================================================== */

        loadingProgress.style.width =
            progress + "%";


        /* =================================================
           JS 05 — COUNTDOWN 10 → 0
           Fungsi:
           Mengubah 100% menjadi angka 10 → 0.
           
           100% = 0
           90%  = 1
           80%  = 2
           ...
           10%  = 9
           0%   = 10
        ================================================== */

        const countdown =
            Math.ceil((100 - progress) / 10);


        /* =================================================
           JS 06 — UPDATE ANGKA
        ================================================== */

        loadingPercent.textContent =
            countdown;


        /* =================================================
           JS 07 — JIKA LOADING SELESAI
        ================================================== */

        if (progress >= 100) {

            clearInterval(loadingInterval);

            loadingPercent.textContent = "0";


            /* =============================================
               JS 08 — FADE OUT
            ============================================== */

            setTimeout(() => {

                loadingScreen.classList.add("hide");

            }, 500);

        }

    }, 50);



        /* =====================================================
   JS 02.01 — BIG COUNTDOWN
   Fungsi:
   Menghubungkan angka besar dengan progress loading.
===================================================== */

const bigCountdown =
    document.getElementById("bigCountdown");

</script>


</body>

</html>
