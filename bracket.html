<script>
  // =========================================================================
  // 📍 BAGIAN PENGATURAN BRACKET (EDIT DI SINI)
  // =========================================================================
  // • Jika mau 8 TIM SAJA  -> HAPUS Babak 1 (Round of 16)
  // • Jika mau 16 TIM     -> Pakai semua babak dari Babak 1
  // • `winner`: Set ke 1 (Tim Atas Menang), 2 (Tim Bawah Menang), atau 0 (Belum Main)
  // =========================================================================

  const bracketData = [
    
    // -----------------------------------------------------------------------
    // 🔹 BABAK 1: ROUND OF 16 (Hapus bagian { ... } ini kalau cuma 8 tim!)
    // -----------------------------------------------------------------------
    {
      roundName: "Round of 16",
      matches: [
        { team1: "Team A", score1: 2, team2: "Team B", score2: 0, winner: 1, lineup: "gambar/lineup1.jpg" }, // 👈 EDIT NAMA & FOTO
        { team1: "Team C", score1: 1, team2: "Team D", score2: 2, winner: 2, lineup: "gambar/lineup2.jpg" },
        { team1: "Team E", score1: 2, team2: "Team F", score2: 1, winner: 1, lineup: "gambar/lineup3.jpg" },
        { team1: "Team G", score1: 0, team2: "Team H", score2: 2, winner: 2, lineup: "gambar/lineup4.jpg" },
        { team1: "Team I", score1: 2, team2: "Team J", score2: 0, winner: 1, lineup: "gambar/lineup5.jpg" },
        { team1: "Team K", score1: 1, team2: "Team L", score2: 2, winner: 2, lineup: "gambar/lineup6.jpg" },
        { team1: "Team M", score1: 2, team2: "Team N", score2: 0, winner: 1, lineup: "gambar/lineup7.jpg" },
        { team1: "Team O", score1: 0, team2: "Team P", score2: 2, winner: 2, lineup: "gambar/lineup8.jpg" },
      ]
    },

    // -----------------------------------------------------------------------
    // 🔹 BABAK 2: QUARTER FINAL (8 Besar)
    // -----------------------------------------------------------------------
    {
      roundName: "Quarter Final",
      matches: [
        { team1: "Team A", score1: 2, team2: "Team D", score2: 1, winner: 1, lineup: "gambar/lineup-qf1.jpg" }, // 👈 EDIT NAMA & FOTO
        { team1: "Team E", score1: 0, team2: "Team H", score2: 2, winner: 2, lineup: "gambar/lineup-qf2.jpg" },
        { team1: "Team I", score1: 2, team2: "Team L", score2: 0, winner: 1, lineup: "gambar/lineup-qf3.jpg" },
        { team1: "Team M", score1: 1, team2: "Team P", score2: 2, winner: 2, lineup: "gambar/lineup-qf4.jpg" },
      ]
    },

    // -----------------------------------------------------------------------
    // 🔹 BABAK 3: SEMI FINAL (4 Besar)
    // -----------------------------------------------------------------------
    {
      roundName: "Semi Final",
      matches: [
        { team1: "Team A", score1: 2, team2: "Team H", score2: 0, winner: 1, lineup: "gambar/lineup-sf1.jpg" }, // 👈 EDIT NAMA & FOTO
        { team1: "Team I", score1: 1, team2: "Team P", score2: 2, winner: 2, lineup: "gambar/lineup-sf2.jpg" },
      ]
    },

    // -----------------------------------------------------------------------
    // 🏆 BABAK 4: GRAND FINAL
    // -----------------------------------------------------------------------
    {
      roundName: "Grand Final",
      matches: [
        { team1: "Team A", score1: "-", team2: "Team P", score2: "-", winner: 0, lineup: "gambar/lineup-gf.jpg" } // 👈 EDIT NAMA & FOTO
      ]
    }

  ];

  // =========================================================================
  // ⚠️ SISTEM OTOMATIS (JANGAN DIUBAH BAGIAN BAWAH INI)
  // =========================================================================
  function renderBracket() {
    const container = document.getElementById('bracketContainer');
    container.innerHTML = '';

    bracketData.forEach(round => {
      const roundDiv = document.createElement('div');
      roundDiv.className = 'round';

      const titleDiv = document.createElement('div');
      titleDiv.className = 'round-title';
      titleDiv.innerText = round.roundName;
      roundDiv.appendChild(titleDiv);

      round.matches.forEach(match => {
        const matchDiv = document.createElement('div');
        matchDiv.className = 'match';
        matchDiv.onclick = () => openModal(match.lineup);

        const team1Class = match.winner === 1 ? 'team winner' : 'team';
        const team2Class = match.winner === 2 ? 'team winner' : 'team';

        matchDiv.innerHTML = `
          <div class="${team1Class}">
            <span>${match.team1}</span>
            <span class="score">${match.score1}</span>
          </div>
          <div class="${team2Class}">
            <span>${match.team2}</span>
            <span class="score">${match.score2}</span>
          </div>
          <span class="match-hint">🔍 Klik untuk Lineup</span>
        `;

        roundDiv.appendChild(matchDiv);
      });

      container.appendChild(roundDiv);
    });
  }

  function openModal(imageSrc) {
    document.getElementById('lineupImg').src = imageSrc;
    document.getElementById('lineupModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('lineupModal').style.display = 'none';
  }

  window.onclick = function(event) {
    const modal = document.getElementById('lineupModal');
    if (event.target === modal) closeModal();
  }

  renderBracket();
</script>
